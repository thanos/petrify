[package]
name = "petrify"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
authors = ["Thanos Vassilakis <thanosv@gmail.com>"]
description = "Petrify live websites into static offline copies"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/thanos/petrify"
homepage = "https://github.com/thanos/petrify"
documentation = "https://docs.rs/petrify"
keywords = ["static", "website", "offline", "wget", "archive", "petrify"]
categories = ["command-line-utilities", "web-programming"]
exclude = [
    "test_output/**",
    "example_output/**",
    "test_site/**",
    "simple_test.html",
    "test_petrify.sh",
    ".github/**",
    "scripts/**",
    "GITHUB_ACTIONS.md",
]

[dependencies]
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["stream", "rustls-tls"] }
url = "2.4"
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
html5ever = "0.26"
markup5ever_rcdom = "0.2"
anyhow = "1.0"
indicatif = "0.17"
image = "0.24"
webp = "0.2"
regex = "1.0"
log = "0.4"
env_logger = "0.10"
colored = "2.0"
num_cpus = "1.17.0"

[dev-dependencies]
image = "0.24"
tempfile = "3.10"
wiremock = "0.6"

[profile.release]
lto = true
codegen-units = 1
strip = true
