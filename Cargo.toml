[package]
name = "petrify"
version = "0.2.0"
edition = "2021"
rust-version = "1.74"
authors = ["Thanos Vassilakis <thanosv@gmail.com>"]
description = "Petrify live websites into static offline copies"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/thanos/petrify"
homepage = "https://github.com/thanos/petrify"
documentation = "https://docs.rs/petrify"
keywords = ["static-generator", "website",  "wget", "archive", "mirror"]
categories = ["command-line-utilities", "web-programming"]
exclude = [
    "test_output/**",
    "example_output/**",
    "test_site/**",
    "mb/**",
    "coverage/**",
    "simple_test.html",
    "test_petrify.sh",
    ".github/**",
    "scripts/**",
    "GITHUB_ACTIONS.md",
    ".tool-versions",
]

[dependencies]
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
url = { version = "2.4", features = ["serde"] }
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
html5ever = "0.26"
markup5ever_rcdom = "0.2"
anyhow = "1.0.103"
indicatif = "0.18"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
webp = "0.3"
regex = "1.0"
log = "0.4"
env_logger = "0.10"
colored = "3"
num_cpus = "1.17.0"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
tempfile = "3.10"
wiremock = "0.6"

[profile.release]
lto = true
codegen-units = 1
strip = true
